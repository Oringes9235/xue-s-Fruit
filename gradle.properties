# ============================================================
# Xue's Fruit - Gradle 属性配置
# 集中管理 Mod 与 Minecraft 依赖的版本号
# ============================================================

# 模组元信息
mod_version          = 1.0.0
maven_group          = com.xuefengpeng.fruit
archives_base_name   = xuesfruit

# Minecraft / 依赖版本
# Minecraft 1.20.1（Fabric 生态成熟稳定的版本）
minecraft_version    = 1.20.1
# Yarn 官方映射（1.20.1 最新构建）
yarn_mappings        = 1.20.1+build.10
# Fabric Loader（1.20.1 时代的经典稳定版）
loader_version       = 0.15.11
# Fabric API（1.20.1 经典稳定版）
fabric_version       = 0.92.2+1.20.1

# 启用 Loom 的开发日志
org.gradle.jvmargs   = -Xmx4G
# JDK 17
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.3.1
